# Development tooling only. Pinecone has no runtime dependencies (ADR-002).
[project]
name = "pinecone"
description = "Replay what a TAK Server saw, so a debrief can settle what happened and get on with why."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["version"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S603", "S607",   # subprocess with a fixed argv is the point of update.sh's caller
  "S310",           # urllib to a loopback address in tests
  "E501",           # the formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.mypy]
python_version = "3.10"
files = ["build_bundle.py", "pinecone_discover.py", "serve.py", "synth.py", "tests"]
exclude = ["vendor", "dist", "maps", "data"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
