    <path d="M0,23 L11.0,32 L0,41 L-11.0,32 Z" fill="#A35C17"/>
    <path d="M24,23 L35.0,32 L24,41 L13.0,32 Z" fill="#F7F6EB"/>
    <path d="M-36,39 L-25.0,48 L-36,57 L-47.0,48 Z" fill="#F7F6EB"/>
    <path d="M-12,39 L-1.0,48 L-12,57 L-23.0,48 Z" fill="#F7F6EB"/>
    <path d="M12,39 L23.0,48 L12,57 L1.0,48 Z" fill="#F7F6EB"/>
    <path d="M36,39 L47.0,48 L36,57 L25.0,48 Z" fill="#F7F6EB"/>
    <path d="M-36,55 L-25.0,64 L-36,73 L-47.0,64 Z" fill="#F7F6EB"/>
    <path d="M-12,55 L-1.0,64 L-12,73 L-23.0,64 Z" fill="#F7F6EB"/>
    <path d="M12,55 L23.0,64 L12,73 L1.0,64 Z" fill="#F7F6EB"/>
    <path d="M36,55 L47.0,64 L36,73 L25.0,64 Z" fill="#F7F6EB"/>
    <path d="M-24,71 L-13.0,80 L-24,89 L-35.0,80 Z" fill="#F7F6EB"/>
    <path d="M0,71 L11.0,80 L0,89 L-11.0,80 Z" fill="#F7F6EB"/>
    <path d="M24,71 L35.0,80 L24,89 L13.0,80 Z" fill="#F7F6EB"/>
    <path d="M-12,87 L-1.0,96 L-12,105 L-23.0,96 Z" fill="#F7F6EB"/>
    <path d="M12,87 L23.0,96 L12,105 L1.0,96 Z" fill="#F7F6EB"/>
