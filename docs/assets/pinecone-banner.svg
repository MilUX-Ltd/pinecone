  <!-- wordmark -->
  <text x="500" y="228" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="#F7F6EB" letter-spacing="2">PINECONE</text>

  <!-- tagline -->
  <text x="503" y="266" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#B5B171" letter-spacing="0.5">The debrief replay for TAK</text>
</svg>
