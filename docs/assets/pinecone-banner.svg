<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinecone - the debrief replay for TAK">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F7F6EB" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#113308"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- the pinecone mark: a cone of scales, every one a report the box kept; the one in the other colour is the moment the room kept -->
